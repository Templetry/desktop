name: Follow engine releases

# The engine is compiled into this app, so an engine release only reaches
# anyone through a desktop build. This bumps the dependency, proves the
# result still works, and opens a pull request. It never publishes: the app
# updater installs whatever the latest release contains, so a release is a
# decision a person makes, not something a schedule or a repository_dispatch
# may take.
#
#   1. Daily (or on repository_dispatch) the bump job opens a PR.
#   2. A person reviews and merges it.
#   3. A person runs this workflow manually with "publish" ticked; it tags
#      the next minor on main and calls release.yml. The release job uses
#      the "release" environment, so required reviewers can be added there.

on:
  schedule:
    # Daily. The engine does not release often; a day of lag costs nothing.
    - cron: "0 8 * * *"
  repository_dispatch:
    types: [engine-released]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Tag the next minor on main and publish a release. Merge the engine
          bump PR first. Leave unticked to just run the bump and open a PR.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: follow-engine
  cancel-in-progress: false

jobs:
  bump:
    # Never runs when a person asked to publish.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: plan
        name: Has the engine moved?
        run: |
          set -euo pipefail

          latest=$(curl -fsSL https://api.github.com/repos/Templetry/engine/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          [ -n "$latest" ] || { echo "::error::could not read the engine's latest release"; exit 1; }

          current=$(grep -o 'github.com/Templetry/engine v[0-9][^ ]*' go.mod | head -1 | cut -d' ' -f2)
          echo "engine: embedded $current, published $latest"

          if [ "$current" = "$latest" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "nothing to do"
            exit 0
          fi

          # An open PR for this engine version already exists: leave it be.
          branch="follow-engine/$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "engine=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Take the new engine
        if: steps.plan.outputs.bump == 'true'
        env:
          ENGINE: ${{ steps.plan.outputs.engine }}
        run: |
          GOFLAGS=-mod=mod go get "github.com/Templetry/engine@$ENGINE"
          go mod tidy

      # A release is a promise that the thing builds. Proving it before a
      # person is even asked to look is the difference between a skipped
      # bump and a broken one.
      - name: It still builds and its tests pass
        if: steps.plan.outputs.bump == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          (cd frontend && npm ci && npm test && npm run build)
          go build -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...

      - name: Push the bump and open a pull request
        if: steps.plan.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ steps.plan.outputs.engine }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          git config user.name "sebss"
          git config user.email "sebssgarcia502580@gmail.com"
          git checkout -b "$BRANCH"
          git commit -am "engine $ENGINE"
          git push origin "$BRANCH"
          # If the repository forbids Actions from opening pull requests this
          # step fails, but the branch above is already pushed and can be
          # opened by hand.
          gh pr create --base main --head "$BRANCH" \
            --title "engine $ENGINE" \
            --body "Bumps the embedded engine to $ENGINE. Build and tests passed in the follow-engine workflow.

          Merging this does not publish anything. To ship it, run the Follow engine releases workflow manually with publish ticked."

  # Only reached by a person pressing "Run workflow" with publish ticked.
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: next
        name: Tag the next minor on main
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The next minor of whatever this app last shipped, never of the
          # engine: the two version lines are independent and always were.
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          [ -n "$last" ] || { echo "::error::no existing tag to count from"; exit 1; }
          major=$(echo "${last#v}" | cut -d. -f1)
          minor=$(echo "${last#v}" | cut -d. -f2)
          tag="v${major}.$((minor + 1)).0"
          engine=$(grep -o 'github.com/Templetry/engine v[0-9][^ ]*' go.mod | head -1 | cut -d' ' -f2)

          echo "last release $last, next $tag, engine $engine, requested by $ACTOR"
          git config user.name "sebss"
          git config user.email "sebssgarcia502580@gmail.com"
          git tag -a "$tag" -m "$tag — engine $engine

          Published manually by $ACTOR."
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
