name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build app and installer
        run: wails build -nsis -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Rename artifacts
        shell: pwsh
        run: |
          Copy-Item "build/bin/Templetry.exe" "build/bin/Templetry-${{ github.ref_name }}-windows-amd64.exe"
          $installer = Get-ChildItem "build/bin" -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "build/bin/Templetry-${{ github.ref_name }}-windows-installer.exe" }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem "build/bin" -Filter "Templetry-${{ github.ref_name }}-*" | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files `
            --title "Templetry Desktop ${{ github.ref_name }}" --generate-notes
