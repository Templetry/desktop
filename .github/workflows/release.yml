name: Release

on:
  push:
    tags: ["v*"]
  # Also callable, so a workflow that creates a tag can publish it. A tag
  # pushed with the default token does not start another workflow, which is
  # what makes calling this one the only way to automate a release.
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Build app and installer
        run: wails build -nsis -ldflags "-X main.version=${{ inputs.tag || github.ref_name }}"
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build/bin/Templetry.exe" "dist/Templetry-${{ inputs.tag || github.ref_name }}-windows-amd64.exe"
          $installer = Get-ChildItem "build/bin" -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "dist/Templetry-${{ inputs.tag || github.ref_name }}-windows-installer.exe" }
          else { Write-Host "no installer artifact found" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install webkit and gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build app
        run: wails build -tags webkit2_41 -ldflags "-X main.version=${{ inputs.tag || github.ref_name }}"
      - name: Collect artifacts
        run: |
          mkdir dist
          cp build/bin/Templetry "dist/Templetry-${{ inputs.tag || github.ref_name }}-linux-amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build universal app
        run: wails build -platform darwin/universal -ldflags "-X main.version=${{ inputs.tag || github.ref_name }}"
      - name: Collect artifacts
        run: |
          mkdir dist
          ditto -c -k --keepParent "build/bin/Templetry.app" "dist/Templetry-${{ inputs.tag || github.ref_name }}-darwin-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" dist/* \
            --title "Templetry Desktop ${{ inputs.tag || github.ref_name }}" --generate-notes
