name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # For the live forge checks below, which depend on servers this repo does
    # not control.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release workflow builds on a tag, which is far too late to learn that
  # the tree does not compile. This runs the same checks the engine has, plus
  # the frontend, on every push.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the frontend
        # main.go embeds frontend/dist with go:embed, so the Go build cannot
        # even start until this exists.
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet -tags webkit2_41 ./...

      - name: build
        run: go build -tags webkit2_41 ./...

      - name: test
        run: go test -tags webkit2_41 ./...

  # Reads public repositories on gitlab.com and Codeberg with no token. These
  # are assumptions about someone else's JSON, so they can break without this
  # repository changing — which is why they also run weekly rather than only
  # when something here moves.
  live-forges:
    # Not on every push: these call gitlab.com and Codeberg, and a push is not
    # what makes them fail.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Live forge checks
        run: go test -tags "liveapi webkit2_41" -run Live -v ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        # `npm run build` is tsc followed by vite build: a type error fails
        # here rather than at release time.
        run: npm run build
